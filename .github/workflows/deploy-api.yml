name: Deploy PTfinder API

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ./PTfinder.API/PTfinder.API.csproj

      - name: Build
        run: dotnet build ./PTfinder.API/PTfinder.API.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish ./PTfinder.API/PTfinder.API.csproj -c Release -o ./publish --no-restore

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ptn-api-webapp
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
