name: Deploy PTfinder API

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      ConnectionStrings__mycon: ${{ secrets.AZURE_SQL_CONNECTIONSTRING }}
      Jwt__Key: ${{ secrets.JWT_KEY }}
      AzureStorage__ConnectionString: ${{ secrets.AZURE_STORAGE_CONNECTIONSTRING }}
      Smtp__Pass: ${{ secrets.SMTP_PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ./PTfinder.API/PTfinder.API.csproj

      - name: Build
        run: dotnet build ./PTfinder.API/PTfinder.API.csproj -c Release --no-restore

      # One-time additive schema migration approved for the private chat tables.
      # This is removed immediately after the migration run succeeds.
      - name: Apply private conversation migration
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.8
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          dotnet ef database update 20260811231602_AddPrivateConversations \
            --project ./PTfinder.API/PTfinder.API.csproj \
            --configuration Release \
            --connection "${{ secrets.AZURE_SQL_CONNECTIONSTRING }}"

      - name: Publish
        run: dotnet publish ./PTfinder.API/PTfinder.API.csproj -c Release -o ./publish --no-restore


      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

